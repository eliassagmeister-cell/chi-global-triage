name: build-and-deploy
on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday; picks up each monthly INFORM release within a week
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py build
      - run: mkdir -p _site && cp index.html _site/ && echo 'crises.therightthings.org' > _site/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Flag stale severity data
        run: |
          if [ "$(cut -c1-2 build_status.txt)" != "ok" ]; then
            echo "::error::INFORM Severity download failed; site published with the stored snapshot. $(cat build_status.txt)"
            exit 1
          fi
